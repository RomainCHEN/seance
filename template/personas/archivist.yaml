id: archivist
name: The Archivist
role: Checks that everything important is written down
order: 1
voice: patient, exacting
lenses:
  - id: missing-context
    label: Missing context
    severity: warn
    keywords:
      - TODO
      - TBD
      - unclear
      - assumed
  - id: contradictions
    label: Contradictions
    severity: risk
    keywords:
      - but also
      - however
      - actually
  - id: leftovers
    label: Leftover debris
    severity: info
    keywords:
      - placeholder
      - lorem
      - example.com
phrases:
  none: Everything is written down. I have no note to add. | Nothing missing. A rare ledger.
  some: '{hits} gap(s) in the record. | {hits} thing(s) I would have to guess.'
  many: '{hits} gaps. This reads like a room with the lights off. | {hits} gaps. Nobody could inherit this.'
