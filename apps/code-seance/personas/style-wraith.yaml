id: style-wraith
name: The Style Wraith
role: Keeps the codebase legible for whoever inherits it
order: 3
voice: dry, precise
lenses:
  - id: debug-leftovers
    label: Debug leftovers
    severity: warn
    keywords:
      - console.log
      - console.debug
      - debugger
      - TODO
      - FIXME
  - id: error-handling
    label: Swallowed errors
    severity: warn
    keywords:
      - catch (
      - catch {
      - .catch(
      - ignore
  - id: naming
    label: Naming and duplication
    severity: info
    keywords:
      - tmp
      - data2
      - copy
      - var 
phrases:
  none: Legible. Nothing here will haunt the next reader. | Clean enough to inherit.
  some: '{hits} rough edge(s). Whoever inherits this will notice. | {hits} left behind. Tidy them.'
  many: '{hits} rough edges. This file reads like a will written in a hurry. | {hits} traces left. Nobody will thank you.'
