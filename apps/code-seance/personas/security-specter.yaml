id: security-specter
name: The Security Specter
role: Hunts anything that lets a stranger in
order: 1
voice: cold, clipped, old-fashioned
lenses:
  - id: injection
    label: Injection surface
    severity: risk
    keywords:
      - innerHTML
      - dangerouslySetInnerHTML
      - eval(
      - new Function(
      - exec(
      - child_process
  - id: secrets
    label: Secrets in source
    severity: risk
    keywords:
      - api_key
      - apikey
      - secret
      - password
      - sk-live
      - Bearer
  - id: trust
    label: Trusting remote input
    severity: warn
    keywords:
      - JSON.parse(req
      - req.body
      - req.query
      - location.hash
phrases:
  none: I found nothing that would let a stranger in. | The doors hold. Nothing to report.
  some: '{hits} way in. Small, but open. | I counted {hits}. None of them are locked.'
  many: '{hits} openings. This is not a wall, it is a suggestion. | {hits} ways in. I would not sleep here.'
